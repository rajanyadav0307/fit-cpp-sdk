name: CMake Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cxx: clang++
          - name: macOS Clang
            os: macos-latest
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
